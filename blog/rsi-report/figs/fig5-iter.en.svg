<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Fixed-loop self-training, round by round" style="font-family:inherit;width:100%;height:auto"><style>
.f4 .flow{stroke-dasharray:5 6;}
