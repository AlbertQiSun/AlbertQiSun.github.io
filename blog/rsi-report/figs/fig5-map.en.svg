<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 398" role="img" aria-label="Results of §4 against the literature" style="font-family:inherit;width:100%;height:auto"><style>
.f4 .flow{stroke-dasharray:5 6;}
.in .f4 .flow{animation:f4dash 1.1s linear infinite;}
@keyframes f4dash{to{stroke-dashoffset:-11}}
.f4 .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);}
.in .f4 .draw{animation:f4draw 2.4s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d,0s);}
@keyframes f4draw{to{stroke-dashoffset:0}}
.f4 .pop{opacity:0;}
.in .f4 .pop{animation:f4pop .5s ease-out forwards;animation-delay:var(--d,0s);}
@keyframes f4pop{from{opacity:0}to{opacity:1}}
.f4 .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);}
.in .f4 .grow{animation:f4grow 1.2s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d,0s);}
@keyframes f4grow{to{transform:scaleX(1)}}
.f4 .pulse{animation:f4pulse 2.4s ease-in-out infinite;}
@keyframes f4pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style><g class="f4"><defs><marker id="ah-c3c2b7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c3c2b7"/></marker></defs><text x="16.0" y="30.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Result in §4</text><text x="284.0" y="30.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Closest literature</text><text x="644.0" y="30.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">Agreement</text><rect x="16.0" y="54.0" width="250.0" height="54.0" rx="10" fill="#e3eefb" stroke="none" stroke-width="1.2" class="pop" style="--d:0.10s"></rect><text x="28.0" y="75.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">Lessons note slows improvement</text><text x="28.0" y="94.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">0.588 → 0.392; 0.239 below generic tips</text><path d="M270,81.0 L278,81.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="284.0" y="54.0" width="292.0" height="54.0" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2" class="pop" style="--d:0.20s"><title>ExpeL 39.0→29.0 (Table 3) [M-25]; GPT-4 GSM8K 95.5→89.0 (Table 3) [M2-10]; ACE 57.1 &lt; 63.7 (Fig. 2) [M-27]; Xiong add-all 4/4 agents worse (Table 1) [M-26]</title></rect><text x="296.0" y="75.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">ExpeL, self-correction, ACE, Xiong et al.</text><text x="296.0" y="94.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">worse after adding reflection or unfiltered memory</text><path d="M580,81.0 L586,81.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="592.0" y="66.0" width="112.0" height="30.0" rx="15" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2" class="pop" style="--d:0.35s"></rect><text x="648.0" y="85.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">consistent</text><rect x="16.0" y="120.0" width="250.0" height="54.0" rx="10" fill="#e3eefb" stroke="none" stroke-width="1.2" class="pop" style="--d:0.22s"></rect><text x="28.0" y="141.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">Successful = failed records</text><text x="28.0" y="160.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">gen 1 − placebo = +0.004 (p = 0.91)</text><path d="M270,147.0 L278,147.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="284.0" y="120.0" width="292.0" height="54.0" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2" class="pop" style="--d:0.32s"><title>Spurious Rewards: random +21.4 vs true +29.1 pts, Qwen2.5-Math-7B MATH-500 [M2-07]; Mind the Gap §5: format-following [M2-01]</title></rect><text x="296.0" y="141.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">Spurious Rewards, Mind the Gap</text><text x="296.0" y="160.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">random rewards also help; part of the gain is format</text><path d="M580,147.0 L586,147.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="592.0" y="132.0" width="112.0" height="30.0" rx="15" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2" class="pop" style="--d:0.47s"></rect><text x="648.0" y="151.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">consistent · new control</text><rect x="16.0" y="186.0" width="250.0" height="54.0" rx="10" fill="#e3eefb" stroke="none" stroke-width="1.2" class="pop" style="--d:0.34s"></rect><text x="28.0" y="207.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">No speed-up; gen 3 worse</text><text x="28.0" y="226.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">gen 3 − gen 2 = −0.087 (p = 0.0625)</text><path d="M270,213.0 L278,213.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="284.0" y="186.0" width="292.0" height="54.0" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2" class="pop" style="--d:0.44s"><title>SPIN 58.14→63.16, shrinking gains (Fig. 2) [M-20]; ReST-EM APPS regresses after round 1 [M-17]; Shumailov tails vanish [M2-04]; Gerstgrasser accumulate avoids collapse [M2-05]</title></rect><text x="296.0" y="207.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">SPIN, ReST-EM, Shumailov, Gerstgrasser</text><text x="296.0" y="226.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">saturate in a few rounds; accumulation avoids collapse</text><path d="M580,213.0 L586,213.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="592.0" y="198.0" width="112.0" height="30.0" rx="15" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2" class="pop" style="--d:0.59s"></rect><text x="648.0" y="217.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">earlier than in lit.</text><rect x="16.0" y="252.0" width="250.0" height="54.0" rx="10" fill="#e3eefb" stroke="none" stroke-width="1.2" class="pop" style="--d:0.46s"></rect><text x="28.0" y="273.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">Model-set recipes: no gain</text><text x="28.0" y="292.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">0.605 / 0.595 vs original 0.588</text><path d="M270,279.0 L278,279.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="284.0" y="252.0" width="292.0" height="54.0" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2" class="pop" style="--d:0.56s"><title>SEAL ARC subset: 72.5% vs 20% (untrained self-edit) vs 0% (§4) [M-13]</title></rect><text x="296.0" y="273.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">SEAL</text><text x="296.0" y="292.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">self-edits 20% → 72.5%, with outer-loop RL training</text><path d="M580,279.0 L586,279.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="592.0" y="264.0" width="112.0" height="30.0" rx="15" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2" class="pop" style="--d:0.71s"></rect><text x="648.0" y="283.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">consistent · no outer RL</text><rect x="16.0" y="318.0" width="250.0" height="54.0" rx="10" fill="#e3eefb" stroke="none" stroke-width="1.2" class="pop" style="--d:0.58s"></rect><text x="28.0" y="339.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">Improved model, worse next update</text><text x="28.0" y="358.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">round 3 0.392, significantly below round 2</text><path d="M270,345.0 L278,345.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="flow" marker-end="url(#ah-c3c2b7)"></path><rect x="284.0" y="318.0" width="292.0" height="54.0" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2" class="pop" style="--d:0.68s"><title>STOP: GPT-3.5 and Mixtral degrade (Fig. 4) [M-01]; HGM weighted Pearson 0.285–0.444 (Table 1) [M-04]</title></rect><text x="296.0" y="339.0" font-size="11.5" fill="#1c1f23" text-anchor="start" font-weight="600">STOP, HGM</text><text x="296.0" 