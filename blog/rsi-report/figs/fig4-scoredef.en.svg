<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="How the improvement-speed score is computed" style="font-family:inherit;width:100%;height:auto"><style>
.f4 .flow{stroke-dasharray:5 6;}
.in .f4 .flow{animation:f4dash 1.1s linear infinite;}
@keyframes f4dash{to{stroke-dashoffset:-11}}
.f4 .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);}
.in .f4 .draw{animation:f4draw 2.4s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d,0s);}
@keyframes f4draw{to{stroke-dashoffset:0}}
.f4 .pop{opacity:0;}
.in .f4 .pop{animation:f4pop .5s ease-out forwards;animation-delay:var(--d,0s);}
@keyframes f4pop{from{opacity:0}to{opacity:1}}
.f4 .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);}
.in .f4 .grow{animation:f4grow 1.2s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d,0s);}
@keyframes f4grow{to{transform:scaleX(1)}}
.f4 .pulse{animation:f4pulse 2.4s ease-in-out infinite;}
@keyframes f4pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style><g class="f4"><defs><marker id="ah-898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#898781"/></marker></defs><path d="M84.0,70 L84.0,70.0 L112.0,70.0 L112.0,98.1 L140.0,98.1 L140.0,98.1 L168.0,98.1 L168.0,116.8 L196.0,116.8 L196.0,116.8 L224.0,116.8 L224.0,116.8 L252.0,116.8 L252.0,151.1 L280.0,151.1 L280.0,151.1 L308.0,151.1 L308.0,160.5 L336.0,160.5 L336.0,160.5 L364.0,160.5 L364.0,173.0 L392.0,173.0 L392.0,173.0 L420.0,173.0 L420.0,70 Z" fill="#e3eefb" class="grow" style="--d:.2s"><title>Shaded = gap already closed at each attempt; score = shaded area ÷ whole rectangle</title></path><rect x="84.0" y="70.0" width="336.0" height="156.0" rx="0" fill="none" stroke="#e1e0d9" stroke-width="1.2"></rect><path d="M84.0,70.0 L112.0,70.0 L112.0,98.1 L140.0,98.1 L140.0,98.1 L168.0,98.1 L168.0,116.8 L196.0,116.8 L196.0,116.8 L224.0,116.8 L224.0,116.8 L252.0,116.8 L252.0,151.1 L280.0,151.1 L280.0,151.1 L308.0,151.1 L308.0,160.5 L336.0,160.5 L336.0,160.5 L364.0,160.5 L364.0,173.0 L392.0,173.0 L392.0,173.0 L420.0,173.0" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="--len:439"></path><line x1="78.0" y1="70.0" x2="428.0" y2="70.0" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="78.0" y1="226.0" x2="428.0" y2="226.0" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3"/><text x="432.0" y="74.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">start score</text><text x="432.0" y="230.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">reference optimum</text><text x="98.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">1</text><text x="126.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">2</text><text x="154.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">3</text><text x="182.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">4</text><text x="210.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">5</text><text x="238.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">6</text><text x="266.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">7</text><text x="294.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">8</text><text x="322.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">9</text><text x="350.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10</text><text x="378.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">11</text><text x="406.0" y="258.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">12</text><text x="252.0" y="276.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">attempt (12 per research run)</text><text x="74.0" y="148.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">dev loss</text><text x="74.0" y="163.0" font-size="10" fill="#898781" text-anchor="end" font-weight="400">lower = better</text><rect x="496.0" y="64.0" width="208.0" height="150.0" rx="12" fill="#f6f5f1" stroke="none" stroke-width="1.2"></rect><text x="600.0" y="88.0" font-size="12.5" fill="#1c1f23" text-anchor="middle" font-weight="600">Improvement-speed score</text><text x="600.0" y="116.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">per attempt: fraction of gap closed</text><text x="600.0" y="136.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">→ mean over 12 attempts</text><text x="600.0" y="156.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">→ mean over 5 seeds</text><text x="600.0" y="176.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">→ paired over 8 tasks</text><text x="600.0" y="200.0" font-size="10.5" fill="#2a78d6" text-anchor="middle" font-weight="600">0 to 1, higher = better</text><text x="16.0" y="24.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Schematic: the curve is illustrative, not experiment data</text></g></svg>